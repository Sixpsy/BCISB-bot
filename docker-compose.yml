version: "3.8"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Flush print() output immediately so `docker logs` shows real-time activity
      PYTHONUNBUFFERED: "1"
      # Defence-in-depth only. All date logic derives "today" from BANGKOK_TZ
      # explicitly and must not depend on this — CLAUDE.md also documents a
      # bare `python bot.py` run with no compose file.
      TZ: "Asia/Bangkok"
    volumes:
      # Mutable data files — mounted from the NAS folder so they survive rebuilds
      - ./events.json:/app/events.json
      - ./reminders.json:/app/reminders.json
      - ./resources.json:/app/resources.json
      - ./dresscode.json:/app/dresscode.json
      - ./calendar_state.json:/app/calendar_state.json
      - ./recurring.json:/app/recurring.json
      - ./powerschool_state.json:/app/powerschool_state.json
      # Canva links found in relayed messages are queued here; canva_worker.py
      # on the Mac mini drains it. The bot never renders Canva itself — a
      # capture peaks near 1 GB and this box has ~1.7 GB free.
      - ./canva_queue.json:/app/canva_queue.json
