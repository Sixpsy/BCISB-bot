version: "3.8"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Flush print() output immediately so `docker logs` shows real-time activity
      PYTHONUNBUFFERED: "1"
    volumes:
      # Mutable data files — mounted from the NAS folder so they survive rebuilds
      - ./events.json:/app/events.json
      - ./reminders.json:/app/reminders.json
      - ./resources.json:/app/resources.json
      - ./dresscode.json:/app/dresscode.json
      - ./calendar_state.json:/app/calendar_state.json
      - ./recurring.json:/app/recurring.json
